# Drop-in for laynes-api.service: enable the optional OpenAI provider.
# Install as /etc/systemd/system/laynes-api.service.d/20-openai.conf
#
# No secret here. OPENAI_API_KEY stays in the protected .env that
# backend/api.py already loads (load_dotenv, override=False), so these three
# switches come from systemd and the key from .env -- nothing is copied.
# Claude remains the default model; these only add GPT-6 Luna to the picker.
#
# Enable:   install this file, systemctl daemon-reload, and restart
#           laynes-api ONLY when chat_jobs has no queued/processing rows.
# Disable:  remove this file, daemon-reload, restart (same zero-jobs rule).
[Service]
Environment=OPENAI_ENABLED=1
Environment=OPENAI_ALLOWED_MODELS=gpt-6-luna
Environment=OPENAI_DEFAULT_MODEL=gpt-6-luna
