# /etc/systemd/system/revel-daily-sync.service.d/10-release.conf
# Run the nightly Revel sync from the clean release checkout (a detached
# checkout of a merged commit), not the development tree, which holds
# unfinished, uncommitted work. Same pattern as laynes-api's 10-release.conf.
#
# PRICE_HISTORY_REFRESH keeps the development tree's existing step 1b (the
# materialized price-history refresh, not merged yet) running exactly as it
# did, at the same point in the sequence. Remove the line when that work is
# merged or abandoned.
#
# Roll back: delete this file, `systemctl daemon-reload`. The unit then runs
# /root/pos-analytics-pipeline/run.sh again, unchanged.
[Service]
WorkingDirectory=/root/pos-analytics-pipeline-release
ExecStart=
ExecStart=/root/pos-analytics-pipeline-release/run.sh
Environment=LAYNES_VENV=/root/pos-analytics-pipeline/venv
Environment=PRICE_HISTORY_REFRESH=/root/pos-analytics-pipeline/refresh_price_history.py
