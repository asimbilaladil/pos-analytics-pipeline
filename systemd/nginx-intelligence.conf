server {
    server_name intelligence.aygchicken.com;

    # Root: Laynes Intelligence — React SPA (built assets) + FastAPI on :8700.
    # Replaced the Streamlit proxy (was 127.0.0.1:8504). To roll back, restore
    # the backup in /root/deploy-backups/<ts>/nginx-intelligence.conf and
    # `systemctl start laynes-admin-chat`.
    # Served from /var/www, NOT from /root: nginx runs as www-data and /root
    # is mode 700 on purpose (it holds .env). Publishing the build to a real
    # web root keeps that boundary intact instead of loosening the home dir.
    root /var/www/laynes-intelligence;
    index index.html;

    # API first: this must not be swallowed by the SPA fallback below.
    location /api/ {
        proxy_pass         http://127.0.0.1:8700;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # An analytics answer can take a couple of minutes; the default 60s
        # read timeout would cut the assistant off mid-question.
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        # Streaming responses (export download, any future SSE) must not sit
        # in a buffer waiting to be flushed.
        proxy_buffering    off;
    }

    # Hashed build assets are immutable; index.html must never be cached or
    # users keep booting an old bundle after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /daily-sales-prediction {
        proxy_pass         http://127.0.0.1:8502/daily-sales-prediction;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 86400;
    }

    location /sales-report {
        proxy_pass         http://127.0.0.1:8503/sales-report;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 86400;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/intelligence.aygchicken.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/intelligence.aygchicken.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = intelligence.aygchicken.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name intelligence.aygchicken.com;
    return 404; # managed by Certbot
}
