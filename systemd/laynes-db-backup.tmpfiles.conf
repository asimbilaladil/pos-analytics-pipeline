# Installed as /etc/tmpfiles.d/laynes-db-backup.conf.
# PREREQUISITE of laynes-db-backup.service / laynes-db-restore-test.service: the
# units' ReadWritePaths= needs the directory to exist BEFORE they start, and the
# tool refuses a backup_dir that is not 0700 and owned by the user it runs as.
# Age field "-": systemd-tmpfiles --clean never deletes backups; retention is the
# tool's job (docs/DATABASE_BACKUP.md "Retention").
#Type  Path                          Mode  User     Group     Age
d      /var/backups/laynes           0700  postgres postgres  -
d      /var/backups/laynes/status    0700  postgres postgres  -
