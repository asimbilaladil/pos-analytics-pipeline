# Install as /etc/tmpfiles.d/laynes-r365-financial.conf (see docs/R365_FINANCIAL_SYNC.md).
#
# INSTALLATION PREREQUISITE of r365-financial-ingest.service. That unit appends its output
# to logs/financial-ingest.service.log via StandardOutput=append:. systemd (verified on 259)
# opens that file BEFORE it creates StateDirectory= directories and before any
# ExecStartPre= runs, so if logs/ is missing the unit fails with 209/STDOUT before any
# code runs. These lines create the directories ahead of time:
#   - at install, with: systemd-tmpfiles --create /etc/tmpfiles.d/laynes-r365-financial.conf
#   - on every boot, through systemd-tmpfiles-setup.service.
# Age "-" means systemd-tmpfiles --clean never removes logs or the lock.
#
# Type Path                                    Mode User Group Age
d      /var/lib/laynes/r365-financial/state    0700 root root  -
d      /var/lib/laynes/r365-financial/logs     0700 root root  -
