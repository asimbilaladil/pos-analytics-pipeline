# /etc/systemd/system/hme-daily-ingest.service.d/20-pending-retry.conf
#
# Production install of the exit-5 contract (hme_daily_ingest/1.4.0).
# The live hme-daily-ingest.service is a symlink into the development tree
# (/root/pos-analytics-pipeline, unfinished pricing work), which must not be
# edited, so the change ships as a drop-in. A non-empty SuccessExitStatus=
# in a drop-in APPENDS to the unit's list: the effective set becomes
# "0 3 75" + "5". Exit 2 stays red.
#
# Exit 5 = reconciliation pending the same day's 10:15 Chicago retry; see
# hme_daily_ingest.assess_pending_retry(). The database is unaffected.
#
# Roll back: delete this file, `systemctl daemon-reload`.
[Service]
SuccessExitStatus=5
