# /etc/systemd/system/hme-reconciliation-retry.service.d/10-release.conf
# Run the HME job from the clean release checkout (a detached checkout of a
# merged commit), not the development tree, which holds unfinished pricing
# work. Same pattern as laynes-api and revel-daily-sync. The shared venv is
# unchanged; the extractor stays the separate /opt/hme-report-downloader app.
#
# Roll back: delete this file, `systemctl daemon-reload`.
[Service]
WorkingDirectory=/root/pos-analytics-pipeline-release
ExecStart=
ExecStart=/root/pos-analytics-pipeline/venv/bin/python /root/pos-analytics-pipeline-release/hme_reconciliation_retry.py
