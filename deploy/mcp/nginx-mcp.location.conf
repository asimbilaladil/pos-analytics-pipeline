# Add INSIDE the existing `server { server_name intelligence.aygchicken.com; ... }`
# block, ABOVE `location /`. Do not edit any other location. NOT applied yet.
#
# Exact match: only /mcp is proxied; /mcp/anything falls through to the SPA
# exactly as before. /api/ and every other route are untouched.
location = /mcp {
    proxy_pass         http://127.0.0.1:8710;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    # Pass the client's Authorization header (default); never log it.
    proxy_buffering    off;
    proxy_request_buffering on;
    client_max_body_size 64k;
    # ask_laynes_question waits up to MCP_ASK_WAIT_SECONDS (90 s) inline.
    proxy_read_timeout 130s;
    proxy_send_timeout 30s;
    # Coarse edge limit in addition to the per-key limit in the service:
    #   (http {} block)  limit_req_zone $binary_remote_addr zone=mcp:10m rate=60r/m;
    limit_req zone=mcp burst=20 nodelay;
}
