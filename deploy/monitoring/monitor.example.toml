# /etc/laynes/monitor.toml -- data monitor settings (no secrets in this file).
# Every key is optional; defaults live in monitoring/config.py. Times are
# America/Chicago. Financial reconciliation tolerances are NOT configurable:
# the Revel ±0.5% comes from chat_sql.RECON_TOLERANCE_PCT at run time.

[monitor]
state_db = "/var/lib/laynes/monitor/monitor.db"
log_file = "/var/lib/laynes/monitor/monitor.log"
release_dir = "/root/pos-analytics-pipeline-release"
# The heartbeat (run by BOTH tiers) needs every tier to SUCCEED within its limit
# and its timer to be enabled + active. Grace after the first ever run:
install_grace_minutes = 60
# Tiers you deliberately do not run (shown as ACCEPTED, never alerted):
disabled_tiers = []

[revel]
ready_after_local = "09:45"      # revel-daily-sync 09:00 + ~25 min
lookback_days = 3
sync_max_age_hours = 26
payment_timing_severity = "WARNING"
# Days the stores did not trade (no-data store-days are then ACCEPTED), e.g.:
# accepted_closed_dates = { "2026-11-26" = "Thanksgiving -- confirm stores closed" }

[hme]
morning_ready_local = "06:30"    # 05:30 run
retry_ready_local = "10:45"      # 10:15 retry
lookback_days = 7
# accepted_dates = { "2026-10-06" = "account-wide HME outage, accepted 2026-11-xx" }

[r365]
week_ready_local = "21:30"       # Thu 20:00 weekly run
lookback_weeks = 3
financial_enabled = true
financial_refresh_grace_days = 10

[notify]
# Start with the log channel and dry_run = true (the default). To go live, add an
# approved channel AND set dry_run = false; credentials go in monitor.env.
channels = ["log"]
dry_run = true
immediate_min_severity = "HIGH"  # WARNING goes to the dashboard + daily summary only
notify_resolutions = true
dashboard_url = "https://intelligence.aygchicken.com/"
max_attempts = 5                 # then FAILED (permanent) + a delivery incident
retry_base_seconds = 60          # backoff 1, 2, 4, 8 min ... capped at:
retry_max_seconds = 3600

# [notify.email]
# smtp_host = "smtp.example.com"
# smtp_port = 587
# starttls = true
# from_addr = "monitor@example.com"
# to_addrs = ["owner@example.com"]

# [services] timers: the ingestion timers (defaults in monitoring/config.py).
# The monitor's OWN timers are checked by the heartbeat; no need to list them.

[infra]
backup_globs = ["/root/deploy-backups/*/*.dump", "/var/backups/laynes/*.dump"]
backup_max_age_hours = 26       # FRESHNESS only -- not proof of recoverability
# Scheduled backups (docs/DATABASE_BACKUP.md). Uncomment when laynes-db-backup is
# installed: then ONLY a successful scheduled backup satisfies freshness, a failed
# attempt alerts at once, and the backup_globs dumps above are listed for
# information only (they no longer count). Dumps inside the scheduled backup
# directory (the parent of status/) are never listed as manual dumps, and only a
# run the backup_timer itself started counts as scheduled.
# backup_status_glob = "/var/backups/laynes/status/backup-*.json"
# backup_timer = "laynes-db-backup.timer"
# restore_test_status_glob = "/var/backups/laynes/status/restore-*.json"
# Off-server copy: only once an offsite destination is approved.
# offsite_status_glob = "/var/backups/laynes/status/offsite-*.json"

[summary]
local_times = ["07:00"]
